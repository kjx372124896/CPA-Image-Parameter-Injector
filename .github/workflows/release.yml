name: release-plugin

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Test
        run: go test -v ./...
      - name: Build Windows amd64 plugin
        run: ./build-windows.sh
      - name: Package and checksum release assets
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            release_tag="${GITHUB_REF_NAME#release/}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          version="${release_tag#v}"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          asset="image-param-injector_${version}_windows_amd64.zip"
          mkdir -p release
          cp build/image-param-injector.dll release/image-param-injector.dll
          (cd release && zip -9 "../${asset}" image-param-injector.dll)
          sha256sum "${asset}" > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            image-param-injector_*_windows_amd64.zip
            checksums.txt
